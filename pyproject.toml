[project]
name = "mackerel-road"
version = "0.1.0"
description = "Game-quality optimization for The Mackerel Road Neurogame"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
cuda = [
    "numpy>=2.4.6",
    "torch>=2.14.0",
]

[project.scripts]
mackerel-extract = "mackerel_road.experiments.artifacts:main"
mackerel-train = "mackerel_road.nn.training:main"
mackerel-plot = "mackerel_road.experiments.plots:main"
mackerel-summarize = "mackerel_road.experiments.summarize:main"
mackerel-remote = "mackerel_road.experiments.remote:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
